<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cardápio - Dona Brownie</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #F6DDE4;
      color: #C91C25;
    }

    .container {
      max-width: 1220px;
      margin: 0 auto;
      padding: 20px;
    }

    .back-btn {
      display: inline-flex;
      margin-bottom: 20px;
      padding: 12px 18px;
      border: 2px solid #C91C25;
      border-radius: 999px;
      background: white;
      color: #C91C25;
      font-weight: bold;
      cursor: pointer;
    }

    .layout {
      display: grid;
      grid-template-columns: 1.35fr 0.8fr;
      gap: 24px;
      align-items: start;
    }

    .hero {
      background: #FBE6EC;
      border: 2px solid #C91C25;
      border-radius: 30px;
      padding: 26px;
      margin-bottom: 22px;
    }

    .hero-badge {
      display: inline-block;
      background: white;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 14px;
      color: #C91C25;
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: 38px;
      color: #C91C25;
    }

    .hero p {
      margin: 0;
      color: #C91C25;
      line-height: 1.6;
      font-size: 15px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .card {
      background: white;
      border-radius: 28px;
      padding: 18px;
      border: 2px solid #FBE6EC;
      box-shadow: 0 10px 24px rgba(0,0,0,0.08);
    }

    .card img {
      width: 100%;
      height: 190px;
      object-fit: cover;
      border-radius: 22px;
      background: #FBE6EC;
      display: block;
      margin-bottom: 14px;
    }

    .placeholder {
      width: 100%;
      height: 190px;
      border-radius: 22px;
      background: #FBE6EC;
      color: #C91C25;
      display: none;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      font-weight: bold;
    }

    .card h3 {
      margin: 0 0 8px;
      font-size: 24px;
      color: #C91C25;
    }

    .card p {
      margin: 0 0 14px;
      color: #8b4b52;
      line-height: 1.5;
      min-height: 78px;
      font-size: 14px;
    }

    .tag {
      display: inline-block;
      margin-bottom: 12px;
      padding: 6px 10px;
      background: #FBE6EC;
      color: #C91C25;
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 8px;
      color: #C91C25;
    }

    select, input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #e7a9b2;
      border-radius: 16px;
      outline: none;
      margin-bottom: 10px;
      font-size: 14px;
      background: white;
      color: #C91C25;
    }

    .mini-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 4px;
    }

    .price-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 14px;
    }

    .price {
      font-size: 24px;
      font-weight: bold;
      color: #C91C25;
    }

    .add-btn, .finish-btn, .option-btn, .coupon-btn {
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    .add-btn {
      background: #C91C25;
      color: white;
      padding: 12px 20px;
      border-radius: 999px;
    }

    .cart-box {
      background: white;
      border-radius: 30px;
      padding: 22px;
      position: sticky;
      top: 20px;
      border: 2px solid #C91C25;
      box-shadow: 0 12px 30px rgba(0,0,0,0.10);
    }

    .cart-title {
      margin: 0 0 18px;
      font-size: 28px;
      color: #C91C25;
    }

    .empty-cart, .cart-item, .summary {
      background: #FBE6EC;
      border-radius: 22px;
      padding: 14px;
      border: 1px solid #e7a9b2;
    }

    .cart-item {
      margin-bottom: 12px;
    }

    .cart-item-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .cart-item h4 {
      margin: 0 0 4px;
      font-size: 16px;
      color: #C91C25;
    }

    .cart-item p {
      margin: 0;
      font-size: 13px;
      color: #8b4b52;
      white-space: pre-line;
    }

    .qty-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
    }

    .qty-btn {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 999px;
      background: white;
      cursor: pointer;
      font-weight: bold;
      color: #C91C25;
    }

    .section {
      margin-top: 22px;
      padding-top: 20px;
      border-top: 1px solid #e7a9b2;
    }

    .section h3 {
      margin: 0 0 12px;
      font-size: 20px;
      color: #C91C25;
    }

    .option-grid-3, .option-grid-2 {
      display: grid;
      gap: 10px;
    }

    .option-grid-3 { grid-template-columns: repeat(3, 1fr); }
    .option-grid-2 { grid-template-columns: repeat(2, 1fr); }

    .option-btn {
      background: white;
      border: 1px solid #e7a9b2;
      border-radius: 18px;
      padding: 14px 10px;
      color: #C91C25;
    }

    .option-btn.active {
      background: #FBE6EC;
      border-color: #C91C25;
    }

    .coupon-area {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }

    .coupon-btn {
      padding: 12px 16px;
      border-radius: 16px;
      background: #C91C25;
      color: white;
    }

    .coupon-info {
      display: block;
      font-size: 12px;
      color: #8b4b52;
      margin-bottom: 10px;
    }

    .coupon-message {
      font-size: 13px;
      font-weight: bold;
      margin-top: 6px;
      color: #C91C25;
    }

    .summary {
      margin-top: 16px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      font-size: 16px;
      font-weight: bold;
      margin: 6px 0;
      color: #C91C25;
    }

    .discount { color: green; }

    .finish-btn {
      width: 100%;
      background: #C91C25;
      color: white;
      padding: 16px;
      border-radius: 999px;
      font-size: 16px;
      margin-top: 16px;
    }

    .finish-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    @media (max-width: 900px) {
      .layout, .products { grid-template-columns: 1fr; }
      .cart-box { position: static; }
      .hero h1 { font-size: 30px; }
    }

    @media (max-width: 520px) {
      .container { padding: 14px; }
      .hero { padding: 20px; }
      .mini-grid, .option-grid-3, .coupon-area { grid-template-columns: 1fr; }
      .price-row { flex-direction: column; align-items: stretch; }
      .add-btn { width: 100%; }
    }
  </style>
</head>

<body>
  <div class="container">
    <button class="back-btn" onclick="voltar()">← Voltar</button>

    <div class="layout">
      <div>
        <div class="hero">
          <span class="hero-badge">Cardápio online</span>
          <h1>Monte seu pedido</h1>
          <p>Escolha seus brownies, revise no carrinho, aplique seu cupom e envie tudo direto para o WhatsApp.</p>
        </div>

        <div class="products" id="products"></div>
      </div>

      <aside class="cart-box">
        <h2 class="cart-title">Seu carrinho</h2>
        <div id="cartItems"></div>

        <div class="section">
          <h3>Pagamento</h3>
          <div class="option-grid-3">
            <button class="option-btn active" data-payment="PIX" onclick="setPayment('PIX', this)">PIX</button>
            <button class="option-btn" data-payment="Débito" onclick="setPayment('Débito', this)">Débito</button>
            <button class="option-btn" data-payment="Crédito" onclick="setPayment('Crédito', this)">Crédito</button>
          </div>
        </div>

        <div class="section">
          <h3>Recebimento</h3>
          <div class="option-grid-2">
            <button class="option-btn active" data-delivery="Entrega" onclick="setDelivery('Entrega', this)">Entrega</button>
            <button class="option-btn" data-delivery="Retirada" onclick="setDelivery('Retirada', this)">Retirada</button>
          </div>
        </div>

        <div class="section">
          <h3>Cupom de desconto</h3>
          <small class="coupon-info">Válido apenas para pedidos acima de R$ 20,00.</small>
          <div class="coupon-area">
            <input id="couponInput" placeholder="Digite seu cupom" />
            <button class="coupon-btn" onclick="applyCoupon()">Aplicar</button>
          </div>
          <div class="coupon-message" id="couponMessage"></div>
        </div>

        <div class="section">
          <h3>Seus dados</h3>
          <input id="customerName" placeholder="Seu nome" />
          <input id="customerPhone" placeholder="Seu WhatsApp" />

          <div id="deliveryFields">
            <input id="customerAddress" placeholder="Rua / Avenida" />
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
              <input id="customerNumber" placeholder="Número" />
              <input id="customerNeighborhood" placeholder="Bairro" />
            </div>
            <input id="customerComplement" placeholder="Complemento" />
            <input id="customerReference" placeholder="Ponto de referência" />
          </div>
        </div>

        <div class="summary">
          <div class="summary-row">
            <span>Subtotal</span>
            <strong id="subtotalPrice">R$ 0,00</strong>
          </div>
          <div class="summary-row discount" id="discountRow" style="display:none;">
            <span>Desconto</span>
            <strong id="discountPrice">- R$ 0,00</strong>
          </div>
          <div class="summary-row">
            <span>Total</span>
            <strong id="totalPrice">R$ 0,00</strong>
          </div>
        </div>

        <button class="finish-btn" id="finishBtn" onclick="finishOrder()" disabled>
          Finalizar pedido no WhatsApp
        </button>
      </aside>
    </div>
  </div>

  <script>
    const products = [
      {
        id: 1,
        name: "Brownie 7x7cm",
        category: "Brownies",
        image: "./produtos/brownie-tradicional.jpg",
        description: "Escolha entre o brownie tradicional ou recheado 7x7cm.",
        price: 6,
        fillings: [
          { name: "Tradicional", extra: 0 },
          { name: "Brigadeiro", extra: 4 },
          { name: "Doce de leite", extra: 4 },
          { name: "Ninho", extra: 4 },
          { name: "Nutella", extra: 4 },
          { name: "Ninho com Nutella", extra: 6 }
        ],
        tag: "Clássico"
      },

      {
        id: 7,
        name: "Brownie 5x5cm",
        category: "Brownies",
        image: "./produtos/brownie-tradicional-5x5.jpg",
        description: "Escolha entre o brownie tradicional ou recheado 5x5cm.",
        price: 5,
        fillings: [
          { name: "Tradicional", extra: 0 },
          { name: "Brigadeiro", extra: 3.5 },
          { name: "Doce de leite", extra: 3.5 },
          { name: "Ninho", extra: 3.5 },
          { name: "Nutella", extra: 3.5 },
          { name: "Ninho com Nutella", extra: 4.5 }
        ],
        tag: "Mini Brownie"
      },

      {
        id: 3,
        name: "Copo recheado",
        category: "Copos",
        image: "./produtos/copo-recheado.jpg",
        description: "Copo super recheado e delicioso.",
        price: 16,
        fillings: [
          { name: "Ninho com Nutella", extra: 0 },
          { name: "Ninho com brigadeiro", extra: 0 },
          { name: "Brigadeiro com brigadeiro", extra: 0 },
          { name: "Brigadeiro com doce de leite", extra: 0 }
        ],
        tag: "Cremoso"
      },

      {
        id: 4,
        name: "Caxinha Minis",
        category: "Caixas",
        image: "./produtos/caixinha-mini-brownies.jpg",
        description: "Caixinha deliciosa com 6 minis brownies.",
        price: 16,
        fillings: [
          { name: "Ninho", extra: 0 },
          { name: "Brigadeiro", extra: 0 },
          { name: "Nutella", extra: 0 },
          { name: "Doce de leite", extra: 0 }
        ],
        tag: "Monte do seu jeito"
      },

      {
        id: 5,
        name: "Cento de Minis",
        category: "Cento",
        image: "./produtos/cento-mini-brownies.jpg",
        description: "100 minis brownies deliciosos.",
        price: 150,
        fillings: [
          { name: "Tradicional", extra: 0 },
          { name: "Recheado", extra: 75 }
        ],
        tag: "Para festas"
      },

      {
        id: 6,
        name: "Meio cento de minis",
        category: "Meio Cento",
        image: "./produtos/meio-cento-mini-brownie.jpg",
        description: "50 mini brownies deliciosos.",
        price: 80,
        fillings: [
          { name: "Tradicional", extra: 0 },
          { name: "Recheado", extra: 70 },
          { name: "Meio a meio", extra: 32 }
        ],
        tag: "Mais vendido"
      },

      {
        id: 10,
        name: "Trufa",
        category: "Trufas",
        image: "./produtos/trufa.jpg",
        description: "Casquinha de chocolate cremosa por fora e o sabor irresistível do nosso brownie por dentro.",
        price: 5,
        fillings: [
          { name: "Ninho", extra: 0 },
          { name: "Brigadeiro", extra: 0 }
        ],
        tag: "Novidade"
      }
    ];

    const coupons = {
  DAILY10: {
    type: "percent",
    value: 10,
    min: 20,
    label: "10% de desconto"
  },

  DONA5: {
    type: "fixed",
    value: 5,
    min: 20,
    label: "R$ 5,00 de desconto"
  },

  DIVAS15: {
    type: "percent",
    value: 15,
    min: 30,
    label: "15% de desconto"
  }
};

    let cart = [];
    let payment = "PIX";
    let deliveryType = "Entrega";
    let activeCoupon = null;

    function formatPrice(value) {
      return value.toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
      });
    }

    function voltar() {
      window.location.href = "index.html";
    }

    function getSubtotal() {
      return cart.reduce((acc, item) => acc + item.price * item.quantity, 0);
    }

    function getDiscount(subtotal) {
      if (!activeCoupon) return 0;

      if (activeCoupon.type === "percent") {
        return subtotal * (activeCoupon.value / 100);
      }

      if (activeCoupon.type === "fixed") {
        return Math.min(activeCoupon.value, subtotal);
      }

      return 0;
    }

    function applyCoupon() {
      const input = document.getElementById("couponInput");
      const message = document.getElementById("couponMessage");
      const code = input.value.trim().toUpperCase();
      const subtotal = getSubtotal();

      if (!code) {
        activeCoupon = null;
        message.textContent = "Digite um cupom para aplicar.";
        renderCart();
        return;
      }

      if (cart.length === 0) {
        activeCoupon = null;
        message.textContent = "Adicione um produto ao carrinho antes de aplicar o cupom.";
        renderCart();
        return;
      }

     if (coupons[code]) {

  if (subtotal < coupons[code].min) {
    activeCoupon = null;

    message.textContent =
      `Este cupom é válido apenas para pedidos acima de ${formatPrice(coupons[code].min)}.`;

    renderCart();
    return;
  }

  activeCoupon = {
    code,
    ...coupons[code]
  };

  message.textContent =
    `Cupom ${code} aplicado: ${activeCoupon.label}.`;

} else {
  activeCoupon = null;
  message.textContent = "Cupom inválido.";
}

      if (coupons[code]) {
        activeCoupon = {
          code,
          ...coupons[code]
        };

        message.textContent = `Cupom ${code} aplicado: ${activeCoupon.label}.`;
      } else {
        activeCoupon = null;
        message.textContent = "Cupom inválido.";
      }

      renderCart();
    }

    function getMiniBoxChoices(productId) {
      const choices = [];

      for (let i = 1; i <= 6; i++) {
        const el = document.getElementById(`mini-${productId}-${i}`);
        choices.push(el ? el.value : "");
      }

      return choices;
    }

    function renderProducts() {
      const container = document.getElementById("products");
      container.innerHTML = "";

      products.forEach((product) => {
        const card = document.createElement("div");
        card.className = "card";

        const options = product.fillings
          .map((filling) =>
            `<option value="${filling.name}">${filling.name}${filling.extra > 0 ? ` (+${formatPrice(filling.extra)})` : ""}</option>`
          )
          .join("");

        let productOptionsHtml = "";

        if (product.id === 4) {
          productOptionsHtml = `
            <label>Escolha os 6 sabores</label>
            <div class="mini-grid">
              <select id="mini-4-1">${options}</select>
              <select id="mini-4-2">${options}</select>
              <select id="mini-4-3">${options}</select>
              <select id="mini-4-4">${options}</select>
              <select id="mini-4-5">${options}</select>
              <select id="mini-4-6">${options}</select>
            </div>
          `;
        } else {
          productOptionsHtml = `
            <label>Escolha a opção</label>
            <select id="select-${product.id}">
              ${options}
            </select>
          `;
        }

        card.innerHTML = `
          <img src="${product.image}" alt="${product.name}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
          <div class="placeholder">Foto do produto</div>
          <span class="tag">${product.tag}</span>
          <h3>${product.name}</h3>
          <p>${product.description}</p>
          ${productOptionsHtml}
          <div class="price-row">
            <span class="price" id="price-${product.id}">${formatPrice(product.price)}</span>
            <button class="add-btn" onclick="addToCart(${product.id})">Adicionar</button>
          </div>
        `;

        container.appendChild(card);

        if (product.id !== 4) {
          const select = card.querySelector(`#select-${product.id}`);

          select.addEventListener("change", function () {
            updateDisplayedPrice(product.id);
          });

          updateDisplayedPrice(product.id);
        }
      });
    }

    function updateDisplayedPrice(productId) {
      const product = products.find((p) => p.id === productId);

      if (!product || product.id === 4) return;

      const select = document.getElementById(`select-${productId}`);
      const selected = product.fillings.find((f) => f.name === select.value);
      const totalPrice = product.price + selected.extra;

      document.getElementById(`price-${productId}`).textContent = formatPrice(totalPrice);
    }

    function addToCart(productId) {
      const product = products.find((p) => p.id === productId);

      if (product.id === 4) {
        const selectedChoices = getMiniBoxChoices(productId);

        const fillingText = selectedChoices
          .map((item, index) => `${index + 1}. ${item}`)
          .join("\n");

        cart.push({
          id: product.id,
          name: product.name,
          category: product.category,
          filling: fillingText,
          price: product.price,
          quantity: 1,
          uniqueKey: Date.now() + Math.random()
        });

        renderCart();
        return;
      }

      const select = document.getElementById(`select-${productId}`);
      const selectedFilling = product.fillings.find((f) => f.name === select.value);
      const finalPrice = product.price + selectedFilling.extra;

      const existing = cart.find(
        (item) => item.id === product.id && item.filling === selectedFilling.name
      );

      if (existing) {
        existing.quantity += 1;
      } else {
        cart.push({
          id: product.id,
          name: product.name,
          category: product.category,
          filling: selectedFilling.name,
          price: finalPrice,
          quantity: 1,
          uniqueKey: Date.now() + Math.random()
        });
      }

      renderCart();
    }

    function updateQuantity(uniqueKey, delta) {
      const item = cart.find((i) => i.uniqueKey === uniqueKey);

      if (!item) return;

      item.quantity += delta;

      if (item.quantity <= 0) {
        cart = cart.filter((i) => i.uniqueKey !== uniqueKey);
      }

      renderCart();
    }

    function renderCart() {
      const cartItems = document.getElementById("cartItems");
      const subtotalPrice = document.getElementById("subtotalPrice");
      const discountPrice = document.getElementById("discountPrice");
      const discountRow = document.getElementById("discountRow");
      const totalPrice = document.getElementById("totalPrice");
      const finishBtn = document.getElementById("finishBtn");

      if (cart.length === 0) {
        cartItems.innerHTML = `<div class="empty-cart">Nenhum item adicionado ainda.</div>`;
        subtotalPrice.textContent = formatPrice(0);
        discountPrice.textContent = `- ${formatPrice(0)}`;
        totalPrice.textContent = formatPrice(0);
        discountRow.style.display = "none";
        finishBtn.disabled = true;
        return;
      }

      cartItems.innerHTML = "";

      cart.forEach((item) => {
        const div = document.createElement("div");
        div.className = "cart-item";

        div.innerHTML = `
          <div class="cart-item-top">
            <div>
              <h4>${item.name}</h4>
              <p>Opção: ${item.filling}</p>
            </div>
            <strong>${formatPrice(item.price * item.quantity)}</strong>
          </div>
          <div class="qty-row">
            <button class="qty-btn" onclick="updateQuantity(${item.uniqueKey}, -1)">-</button>
            <span>${item.quantity}</span>
            <button class="qty-btn" onclick="updateQuantity(${item.uniqueKey}, 1)">+</button>
          </div>
        `;

        cartItems.appendChild(div);
      });

      const subtotal = getSubtotal();

      if (activeCoupon && subtotal < 20) {
        activeCoupon = null;
        document.getElementById("couponMessage").textContent =
          "Cupom removido: o pedido ficou abaixo de R$ 20,00.";
      }

      const discount = getDiscount(subtotal);
      const total = subtotal - discount;

      subtotalPrice.textContent = formatPrice(subtotal);
      discountPrice.textContent = `- ${formatPrice(discount)}`;
      totalPrice.textContent = formatPrice(total);

      discountRow.style.display = discount > 0 ? "flex" : "none";
      finishBtn.disabled = false;
    }

    function setPayment(value, button) {
      payment = value;

      document.querySelectorAll("[data-payment]").forEach((btn) => {
        btn.classList.remove("active");
      });

      button.classList.add("active");
    }

    function setDelivery(value, button) {
      deliveryType = value;

      document.querySelectorAll("[data-delivery]").forEach((btn) => {
        btn.classList.remove("active");
      });

      button.classList.add("active");

      document.getElementById("deliveryFields").style.display =
        value === "Entrega" ? "block" : "none";
    }

    function finishOrder() {
      if (cart.length === 0) return;

      const name = document.getElementById("customerName").value.trim();
      const phone = document.getElementById("customerPhone").value.trim();
      const address = document.getElementById("customerAddress").value.trim();
      const number = document.getElementById("customerNumber").value.trim();
      const neighborhood = document.getElementById("customerNeighborhood").value.trim();
      const complement = document.getElementById("customerComplement").value.trim();
      const reference = document.getElementById("customerReference").value.trim();

      const grouped = {};

      cart.forEach((item) => {
        if (!grouped[item.category]) grouped[item.category] = [];
        grouped[item.category].push(item);
      });

      let itemsText = "";

      for (const category in grouped) {
        itemsText += `*${category.toUpperCase()}*%0A`;

        grouped[category].forEach((item) => {
          const safeFilling = item.filling.replace(/\n/g, "%0A   ");
          itemsText += `- ${item.name} | Opção: ${safeFilling} | Qtd: ${item.quantity} | ${formatPrice(item.price * item.quantity)}%0A`;
        });

        itemsText += `%0A`;
      }

      const subtotal = getSubtotal();
      const discount = getDiscount(subtotal);
      const total = subtotal - discount;

      let message = `Olá, Dona Brownie!%0A%0A🍫 *Novo pedido*%0A%0A${itemsText}`;
      message += `------------------------%0A`;
      message += `🧾 *Subtotal:* ${formatPrice(subtotal)}%0A`;

      if (activeCoupon && discount > 0) {
        message += `🎟️ *Cupom:* ${activeCoupon.code} (${activeCoupon.label})%0A`;
        message += `✅ *Desconto:* - ${formatPrice(discount)}%0A`;
      }

      message += `💰 *Total:* ${formatPrice(total)}%0A`;
      message += `💳 *Pagamento:* ${payment}%0A`;
      message += `👤 *Cliente:* ${name || "-"}%0A`;
      message += `📱 *Telefone:* ${phone || "-"}%0A`;

      if (deliveryType === "Entrega") {
        message += `🚚 *Recebimento:* Entrega%0A`;
        message += `📍 *Endereço:* ${address || "-"}, Nº ${number || "-"} - ${neighborhood || "-"}%0A`;
        message += `🏷️ *Complemento:* ${complement || "-"}%0A`;
        message += `📌 *Referência:* ${reference || "-"}%0A`;
      } else {
        message += `🛍️ *Recebimento:* Retirada na loja%0A`;
      }

      window.open(`https://wa.me/5586999160590?text=${message}`, "_blank");
    }

    renderProducts();
    renderCart();
    document.getElementById("deliveryFields").style.display = "block";
  </script>
</body>
</html>
